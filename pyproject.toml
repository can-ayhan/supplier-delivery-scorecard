[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-delivery-scorecard"
version = "0.1.0"
description = "Supplier delivery scorecard built from SAP-style purchasing, receipt and inspection exports"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
excel = [
    "openpyxl>=3.1",
    "pywin32>=306; sys_platform == 'win32'",
]
dev = ["pytest>=8"]

[project.scripts]
scorecard = "scorecard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
